name: Release

# 打标签即发布：校验 → 构建安装包（未签名）+ 校验和 → 依赖清单 → 草稿 Release
#   git tag v0.1.0 && git push origin v0.1.0
#
# 开源项目不含企业代码签名证书，安装包为**未签名**：Release 说明会引导使用者核对 SHA256，
# 企业分发请按 docs/delivery/signing.md 自行重签（Windows Authenticode / macOS 公证）。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installers:
    name: 安装包（${{ matrix.label }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            target: win
            pattern: "*.exe"
          - os: macos-latest
            label: macOS
            target: mac
            pattern: "*.dmg"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: 安装依赖
        working-directory: app
        run: npm ci
      - name: 构建安装包
        working-directory: app
        run: |
          npm run build
          npx electron-builder --${{ matrix.target }}
      - name: 生成校验和
        shell: bash
        working-directory: app/dist
        run: |
          shopt -s nullglob
          files=(${{ matrix.pattern }} *.blockmap)
          if command -v sha256sum >/dev/null 2>&1; then
            [ ${#files[@]} -gt 0 ] && sha256sum "${files[@]}" > SHA256SUMS-${{ matrix.target }}.txt || true
          else
            [ ${#files[@]} -gt 0 ] && shasum -a 256 "${files[@]}" > SHA256SUMS-${{ matrix.target }}.txt || true
          fi
          cat SHA256SUMS-${{ matrix.target }}.txt || echo "（未生成校验和）"
      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.target }}
          path: |
            app/dist/*.exe
            app/dist/*.dmg
            app/dist/*.zip
            app/dist/SHA256SUMS-*.txt
          if-no-files-found: warn

  release:
    name: 创建 Release（草稿）
    needs: [installers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: 汇总校验和
        run: |
          find artifacts -name 'SHA256SUMS-*.txt' -exec cat {} \; | sort -k2 > artifacts/SHA256SUMS.txt || true
          cat artifacts/SHA256SUMS.txt || true
      - name: 生成 Release 说明（英文，取自 CHANGELOG.en.md）
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="## [$VERSION]" 'index($0, v) == 1 {flag=1; next} /^## \[/ {flag=0} flag' CHANGELOG.en.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See CHANGELOG.en.md and docs/delivery/release-notes.md." > release-notes.md
          fi
          {
            echo ""
            echo "---"
            echo "### Install and verify"
            echo ""
            echo "1. Windows: run the NSIS installer. macOS: open the .dmg and drag the app into Applications."
            echo "2. The installers are **unsigned**: verify the checksums in \`SHA256SUMS.txt\` before installing."
            echo "   For internal distribution, re-sign them as described in docs/delivery/signing.md."
            echo "3. Server: \`scripts/quickstart.sh up --email you@example.com\` (Docker Compose, one command)."
            echo "   \`HUAGENT_JWT_SECRET\` and \`HUAGENT_MASTER_KEY\` are required outside \`local\` environments."
            echo "4. Self-validation checklist: docs/validation.md - deployment and operations: docs/delivery/."
            echo ""
            echo "Client sign-in is mandatory (no offline mode); the workspace and keychain data stay on the device."
          } >> release-notes.md
          cat release-notes.md
      - name: 发布草稿
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: |
            artifacts/installers-*/**/*.exe
            artifacts/installers-*/**/*.dmg
            artifacts/installers-*/**/*.zip
            artifacts/SHA256SUMS.txt
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
