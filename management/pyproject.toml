[project]
name = "hu-agent-management"
version = "0.1.0"
description = "hu-agent 服务端（FastAPI + SQLAlchemy + PostgreSQL 18）"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "redis>=5.2",
    "apscheduler>=3.11",
    "boto3>=1.35",
    "cryptography>=50.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "testcontainers>=4.9",
    "ruff>=0.9",
    "mypy>=1.14",
]

[project.scripts]
huagent-api = "huagent.api.__main__:main"
huagent-worker = "huagent.worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/huagent"]

# ruff 配置见 ruff.toml（独立文件）；pytest 配置见 pytest.ini

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
exclude = ["tests/integration"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "cryptography.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true
