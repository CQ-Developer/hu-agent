[project]
name = "hu-agent-management"
version = "0.1.0"
description = "hu-agent 服务端（FastAPI + SQLAlchemy + PostgreSQL 18）"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "redis>=5.2",
    "apscheduler>=3.11",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "testcontainers>=4.9",
    "ruff>=0.9",
    "mypy>=1.14",
]

[project.scripts]
huagent-api = "huagent.api.__main__:main"
huagent-worker = "huagent.worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/huagent"]

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]  # 测试中允许 assert

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B008"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
exclude = ["tests/integration"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: 需要 Docker 的集成测试"]
