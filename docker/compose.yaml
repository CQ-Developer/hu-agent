# hu-agent 单文件编排：一键部署全部组件（design 9.x）
#
# 一键全组件（推荐入口，自动准备 .env.quickstart）：
#   scripts/quickstart.sh up                 # 依赖 + API/worker + Keycloak + Mailpit + 监控栈
#   scripts/quickstart.sh up --with-logs     # 再加 Loki + Promtail（容器日志聚合）
#   scripts/quickstart.sh up --core-only     # 只起依赖（PostgreSQL/Redis/MinIO），供本地开发
#   scripts/quickstart.sh down / reset / logs / admin / monitoring ...
#
# 直接使用 compose（等价命令）：
#   docker compose -f docker/compose.yaml --env-file .env.quickstart \
#     --profile app --profile sso --profile mail --profile monitoring up -d
#
# profile 一览：
#   （无）        PostgreSQL + Redis + MinIO（任何组件都依赖，默认启动）
#   app          API + worker
#   sso          Keycloak（企业 SSO 联调用）
#   mail         Mailpit（告警收件箱）
#   monitoring   Prometheus + Grafana + Alertmanager
#   logs         Loki + Promtail（仅 Linux 宿主机可用，见 docs/delivery/monitoring.md 第 5 节）
#
# 本地开发依赖（scripts/dev-deps.sh）复用本文件，通过 --profile sso --profile mail
# 显式启动 postgres/redis/minio/keycloak/mailpit，不启动 API/worker 与监控。
#
# 端口一律绑 127.0.0.1。密钥类变量缺省时使用开发弱口令；api/worker 以 HUAGENT_ENV=production
# 运行，缺少强 JWT_SECRET/MASTER_KEY 时服务端配置守卫会直接拒绝启动（fail fast）。
# 生产部署请参考 docs/delivery/deployment.md（受管 PG/Redis/S3、TLS、多副本、监控）。

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: huagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-huagent_dev}
      POSTGRES_DB: huagent
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PG18+ 镜像约定：挂载到 /var/lib/postgresql（数据在子目录，便于 pg_upgrade）
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huagent -d huagent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    # 社区版不再发布官方镜像，本地源码构建（见 docker/minio/Dockerfile）
    image: huagent-minio:local
    build:
      context: .
      dockerfile: minio/Dockerfile
      args:
        # 可覆盖：GOPROXY=https://goproxy.cn,direct
        MINIO_GOPROXY: ${MINIO_GOPROXY:-https://proxy.golang.org,direct}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-huagent}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-huagent_dev_minio}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # 镜像基于 alpine 且装了 curl（见 Dockerfile）
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: management/Dockerfile
    image: huagent-management:local
    command: ["huagent-api"]
    environment: &app-env
      HUAGENT_ENV: production
      HUAGENT_API_HOST: 0.0.0.0
      HUAGENT_DATABASE_URL: postgresql+psycopg://huagent:${POSTGRES_PASSWORD:-huagent_dev}@postgres:5432/huagent
      HUAGENT_REDIS_URL: redis://redis:6379/0
      # 缺省留空：production 下配置守卫会拒绝启动，提示补齐 .env.quickstart
      HUAGENT_JWT_SECRET: ${JWT_SECRET:-}
      HUAGENT_MASTER_KEY: ${MASTER_KEY:-}
      HUAGENT_RATE_LIMIT_STRICT: "true"
      # 指标端点 Bearer 令牌（scripts/quickstart.sh up 写入 .env.quickstart）
      HUAGENT_METRICS_TOKEN: ${METRICS_TOKEN:-}
      HUAGENT_OBJECT_STORE: s3
      HUAGENT_S3_ENDPOINT: http://minio:9000
      HUAGENT_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-huagent}
      HUAGENT_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-huagent_dev_minio}
      HUAGENT_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8080}
      HUAGENT_CORS_ORIGINS: ${CORS_ORIGINS:-[]}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/api/v1/system/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    profiles: ["app"]
    image: huagent-management:local
    build:
      context: ..
      dockerfile: management/Dockerfile
    command: ["huagent-worker"]
    environment: *app-env
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # 企业 SSO 联调（profile: sso）
  keycloak:
    profiles: ["sso"]
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --http-port=8081
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:8081:8081"
    restart: unless-stopped

  # 告警收件箱（profile: mail）；SMTP 1025 供 Alertmanager 发信
  mailpit:
    profiles: ["mail"]
    image: ${MAILPIT_IMAGE:-axllent/mailpit:latest}
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

  # 监控栈（profile: monitoring）
  prometheus:
    profiles: ["monitoring"]
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.6.0}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  alertmanager:
    profiles: ["monitoring"]
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.28.1}
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      # 缺失时 compose 会创建同名目录导致启动失败：先执行 scripts/quickstart.sh monitoring up
      # （或手工 cp observability/alertmanager/alertmanager.yml.example observability/alertmanager/alertmanager.yml）
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    restart: unless-stopped

  grafana:
    profiles: ["monitoring"]
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.2.0}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # 只读匿名访问（大屏展示用）：置 true 后任何人可看不能改
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped

  # 日志聚合（可选，profile: logs）。需要宿主机 Docker 日志目录与 socket，仅 Linux 可用；
  # Docker Desktop（Windows/macOS）下请改用宿主日志或 Grafana Alloy，见 monitoring.md 第 5 节。
  loki:
    profiles: ["logs"]
    image: ${LOKI_IMAGE:-grafana/loki:3.5.5}
    command: ["-config.file=/etc/loki/loki-config.yml", "-config.expand-env=true"]
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    restart: unless-stopped

  promtail:
    profiles: ["logs"]
    image: ${PROMTAIL_IMAGE:-grafana/promtail:3.5.5}
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
