# hu-agent 本地开发依赖
# 用法：scripts/dev-deps.sh up | down | reset | status
# 说明：仅用于本地开发，账号密码都是弱口令，禁止用于任何共享/生产环境。

name: hu-agent-dev

services:
  postgres:
    image: postgres:18-alpine
    container_name: huagent-postgres
    environment:
      POSTGRES_USER: huagent
      POSTGRES_PASSWORD: huagent_dev
      POSTGRES_DB: huagent
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      # PG18+ 镜像约定：挂载到 /var/lib/postgresql（数据在子目录，便于 pg_upgrade）
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huagent -d huagent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: huagent-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # 社区版不再发布官方镜像，本地源码构建（见 docker/minio/Dockerfile）
    image: huagent-minio:local
    build:
      context: .
      dockerfile: minio/Dockerfile
      args:
        # 可覆盖：GOPROXY=https://goproxy.cn,direct
        GOPROXY: ${MINIO_GOPROXY:-https://proxy.golang.org,direct}
    container_name: huagent-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: huagent
      MINIO_ROOT_PASSWORD: huagent_dev_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: huagent-keycloak
    command: ["start-dev", "--http-port=8081"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8081
    ports:
      - "8081:8081"

  mailpit:
    image: axllent/mailpit:latest
    container_name: huagent-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  redisdata:
  miniodata:
