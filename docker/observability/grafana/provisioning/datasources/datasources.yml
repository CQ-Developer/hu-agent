# Grafana 数据源（自动provision，无需手工点选）
apiVersion: 1

datasources:
  - name: Prometheus
    uid: huagent-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 30s
      httpMethod: POST
    editable: false

  # 仅在启用 logs profile（Loki + Promtail）时可用；未启用不影响其它面板
  - name: Loki
    uid: huagent-loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    jsonData:
      maxLines: 500
      timeout: 60
    editable: false
