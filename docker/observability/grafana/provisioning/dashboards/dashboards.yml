# Grafana 看板自动加载：docker/observability/grafana/dashboards/*.json
apiVersion: 1

providers:
  - name: hu-agent
    orgId: 1
    folder: hu-agent
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
